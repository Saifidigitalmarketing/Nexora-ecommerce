<!doctype html>
<html lang="en-PK">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#006948" />
<title>Offline · NEXORA</title>
<style>
  :root { color-scheme: light; }
  html, body { margin: 0; height: 100%; }
  body { font-family: Inter, system-ui, -apple-system, "Segoe UI", sans-serif; background: #f9f9ff; color: #151c27;
         display: flex; align-items: center; justify-content: center; padding: 16px; box-sizing: border-box; text-align: center; }
  .card { max-width: 340px; display: flex; flex-direction: column; align-items: center; gap: 12px; }
  img { width: 64px; height: 64px; border-radius: 16px; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
  h1 { font-family: "Plus Jakarta Sans", Inter, system-ui, sans-serif; font-size: 24px; line-height: 32px; font-weight: 600; margin: 4px 0 0; letter-spacing: -0.015em; }
  p { font-size: 14px; line-height: 22px; color: #575e70; margin: 0; }
  button { margin-top: 8px; height: 44px; padding: 0 20px; border-radius: 8px; border: 0; background: #006948; color: #fff; font: 600 14px/20px Inter, system-ui, sans-serif; cursor: pointer; }
  .tag { font-size: 10px; letter-spacing: .12em; text-transform: uppercase; color: #575e70; font-weight: 600; margin-top: 16px; }
</style>
</head>
<body>
  <div class="card">
    <img src="/icons/icon-192.png" alt="NEXORA" />
    <h1>You're offline</h1>
    <p>Check your internet connection and try again. Your cart is saved on this device.</p>
    <button type="button" onclick="location.reload()">Try again</button>
    <div class="tag">NEXORA · Everything. One Place.</div>
  </div>
</body>
</html>
