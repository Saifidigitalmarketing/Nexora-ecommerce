<!-- Supabase → Authentication → Email Templates → "Reset password". Subject: Reset your NEXORA password -->
<div style="font-family:Inter,Arial,sans-serif;max-width:480px;margin:0 auto;padding:24px;color:#151c27">
  <p style="font-size:22px;font-weight:800;color:#006948;margin:0 0 4px">NEXORA</p>
  <p style="font-size:13px;color:#575e70;margin:0 0 24px">Everything. One Place.</p>
  <p style="font-size:16px;margin:0 0 16px">We received a request to reset your password. Tap the button below to choose a new one.</p>
  <p style="margin:0 0 24px">
    <a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=recovery&next=/reset-password"
       style="display:inline-block;background:#006948;color:#ffffff;text-decoration:none;font-weight:600;padding:12px 24px;border-radius:8px">Reset password</a>
  </p>
  <p style="font-size:13px;color:#575e70;margin:0">If you didn't ask for this, you can ignore this email — your password won't change.</p>
</div>
